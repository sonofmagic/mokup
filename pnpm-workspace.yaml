packages:
  - apps/*
  - packages/*
  - '!**/test/**'

allowBuilds:
  '@prisma/engines': false
  '@tailwindcss/oxide': true
  esbuild: false
  msgpackr-extract: false
  prisma: false
  sharp: true
  workerd: true

catalogs:
  default:
    '@faker-js/faker': ^10.5.0
    '@tailwindcss/vite': ^4.3.3
    '@types/node': ^26.1.1
    '@vitejs/plugin-vue': ^6.0.8
    pathe: ^2.0.3
    rolldown: 1.2.0
    tailwindcss: ^4.3.3
    tsdown: 0.22.12
    tsx: ^4.23.1
    typescript: ^6.0.3
    vite: ^8.1.5
    vue: ^3.5.40
    wrangler: ^4.112.0

minimumReleaseAgeExclude:
