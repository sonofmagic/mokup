  - '@icebreakers/monorepo@5.0.2'
  - '@intlify/core-base@11.4.7'
  - '@intlify/devtools-types@11.4.7'
  - '@intlify/message-compiler@11.4.7'
  - '@intlify/shared@11.4.7'
  - stylelint@17.14.1
  - tsdown@0.22.12
  - verkit@0.1.0
