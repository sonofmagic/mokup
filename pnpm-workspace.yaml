packages:
  - apps/*
  - packages/*
  - '!**/test/**'
catalog:
  '@cloudflare/vite-plugin': ^1.62.5
  '@faker-js/faker': ^10.6.0
  '@hono/node-server': ^2.1.3
  '@tailwindcss/vite': ^4.3.3
  '@types/node': ^24.19.1
  '@vitejs/plugin-vue': ^6.0.9
  hono: ^4.13.12
  pathe: ^2.0.3
  rolldown: 1.2.12
  tailwindcss: ^4.3.3
  tsdown: 0.23.0
  tsx: ^4.23.15
  typescript: ^6.0.3
  vite: ^8.3.2
  vue: ^3.5.43
  vue-tsc: ^3.3.12
  wrangler: ^4.147.0
autoInstallPeers: true
strictPeerDependencies: false
resolutionMode: highest
pmOnFail: error
minimumReleaseAge: 0
strictDepBuilds: true
allowBuilds:
  '@prisma/engines': false
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: true
  prisma: false
  sharp: true
  workerd: true
versioning:
  changelog:
    storage: repository

# stylelint's css-calc peer requires these compatible patch releases.
overrides:
  # Keep Vite's optional transform types identical across workspace peers.
  vite@8.3.2>esbuild: 0.28.2
  stylelint@17.16.0>@csstools/css-parser-algorithms: 4.0.2
  stylelint@17.16.0>@csstools/css-tokenizer: 4.0.2
  '@asamuzakjp/css-color@5.1.11>@csstools/css-parser-algorithms': 4.0.2
  '@asamuzakjp/css-color@5.1.11>@csstools/css-tokenizer': 4.0.2
  # repoctl's workspace reader requires the matching pnpm logger/worker APIs.
  '@icebreakers/monorepo@5.7.1>@pnpm/logger': 1001.0.1
  '@icebreakers/monorepo@5.7.1>@pnpm/worker': 1000.6.11
  # Retain the remote branch's security floors without pinning all build tools.
  '@babel/plugin-transform-modules-systemjs@>=7.12.0 <=7.29.3': ^7.29.4
  '@hono/node-server@<1.19.13': ^1.19.13
  adm-zip@<0.6.0: ^0.6.0
  cross-spawn@>=7.0.0 <7.0.5: ^7.0.5
  effect@<3.20.0: ^3.20.0
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  hono@<4.12.25: ^4.12.25
  lodash@<=4.17.23: ^4.17.24
  rollup@>=4.0.0 <4.59.0: ^4.59.0
  serialize-javascript@<7.0.5: ^7.0.5
  uuid@<11.1.1: ^11.1.1
  tar@>=7.0.0 <7.5.22: ^7.5.22
  path-to-regexp@>=8.0.0 <8.4.2: ^8.4.2
  linkify-it@>=5.0.0 <5.0.2: ^5.0.2
  postcss@>=8.0.0 <8.5.28: ^8.5.28
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=5.0.0 <5.0.12: ^5.0.12
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  fast-uri@>=3.0.0 <3.1.8: ^3.1.8
