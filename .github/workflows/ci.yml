name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Remote Caching enabled - configure TURBO_TOKEN and TURBO_TEAM in repository settings
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Security Audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Migration Guards
        run: pnpm run guard:migration

      - name: Repository Doctor
        run: pnpm exec repo doctor

      - name: Release Plan
        run: pnpm exec repo release plan --branch main --json

      - name: Lint
        run: pnpm lint

      - name: Line Budget (guard)
        run: pnpm run lint:lines:guard

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Type Tests
        run: pnpm run test:types

      - name: Pack Artifacts
        run: pnpm run release:pack-check

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  runtime:
    name: Published Runtime (Node ${{ matrix.node-version }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.19.0, 22.12.0]
    env:
      HUSKY: 0
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Locate minimum supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Remember runtime executable
        id: runtime
        run: echo "node=$(node -p 'process.execPath')" >> "$GITHUB_OUTPUT"

      - name: Setup build Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6

      - name: Install build dependencies
        run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Build publishable packages
        run: pnpm run build:packages

      - name: Test isolated published artifacts on minimum Node.js
        env:
          RUNTIME_NODE: ${{ steps.runtime.outputs.node }}
        run: node scripts/check-runtime-compat.mjs --node-bin "$RUNTIME_NODE"

  vite-compat:
    name: Published Vite Compatibility
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Build publishable packages
        run: pnpm run build:packages

      - name: Check published loader with Vite 5 through 8
        run: pnpm run test:vite-compat

  e2e:
    name: E2E Tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: build
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chrome --with-deps

      - name: E2E Tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            apps/*/playwright-report
            apps/*/test-results
